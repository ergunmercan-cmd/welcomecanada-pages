<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome Canada</title>
<style>
  :root { color-scheme: light dark; --maple: #C8102E; --ink: #1c1c1e; --bg: #ffffff; --muted: #6b6b6f; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f2f2f3; --bg: #14100e; --muted: #a8a6a2; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 28px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  a.link { color: var(--maple); text-decoration: none; font-weight: 600; font-size: 17px; }
  a.link:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Welcome Canada</h1>
  <p>Study app for the Canadian citizenship test.</p>
  <ul>
    <li><a class="link" href="./privacy.html">Privacy Policy →</a></li>
    <li><a class="link" href="./support.html">Support →</a></li>
  </ul>
</main>
</body>
</html>
